<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus AI</title>
  <!-- Tailwind CSS & Lucide Icons CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Marked for Markdown Parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      --claude-orange: #da7756;
      --claude-orange-hover: #c56545;
      --claude-bg: #1a1917;
      --claude-sidebar: #141312;
      --claude-surface: #22211e;
      --claude-border: #33302c;
      --claude-text: #fbfbfa;
      --claude-muted: #9e9890;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--claude-bg);
      color: var(--claude-text);
    }

    .font-serif-title {
      font-family: 'Newsreader', Georgia, serif;
    }

    code, pre {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Claude-style clean typography */
    .prose pre {
      background: #141312;
      padding: 1.1rem;
      border-radius: 0.75rem;
      overflow-x: auto;
      border: 1px solid var(--claude-border);
    }
    .prose p {
      margin-bottom: 0.9rem;
      line-height: 1.7;
      color: #edeae4;
    }
    .prose strong {
      color: #ffffff;
      font-weight: 600;
    }
    .prose ul, .prose ol {
      padding-left: 1.3rem;
      margin-bottom: 0.9rem;
      color: #edeae4;
    }
    .prose li {
      margin-bottom: 0.35rem;
      line-height: 1.65;
    }
    .prose a {
      color: var(--claude-orange);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .prose a:hover {
      color: #f09575;
    }
    .prose blockquote {
      border-left: 3px solid var(--claude-orange);
      padding-left: 1rem;
      color: #d1cbc1;
      font-style: italic;
    }

    /* Minimal scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #33302c;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4a4640;
    }

    /* Dynamic thinking animation */
    @keyframes subtleShimmer {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }
    .thinking-shimmer {
      animation: subtleShimmer 2s ease-in-out infinite;
    }
  </style>
</head>
<body class="flex h-screen overflow-hidden antialiased bg-[#1a1917] text-[#fbfbfa]">

  <!-- Full Window Drag-and-Drop Overlay for PC -->
  <div id="dropOverlay" class="fixed inset-0 z-50 bg-[#141312]/85 backdrop-blur-sm border-2 border-dashed border-[#da7756] hidden flex flex-col items-center justify-center pointer-events-none transition-all">
    <div class="p-6 rounded-2xl bg-[#22211e] border border-[#33302c] shadow-2xl flex flex-col items-center space-y-3">
      <div class="w-12 h-12 rounded-xl bg-[#da7756]/20 flex items-center justify-center">
        <i data-lucide="upload-cloud" class="w-6 h-6 text-[#da7756]"></i>
      </div>
      <p class="text-sm font-medium text-[#fbfbfa]">Drop document from your PC here</p>
      <p class="text-xs text-[#8e8880]">PDF, Word (.docx), Code, Text, or CSV</p>
    </div>
  </div>

  <!-- ========================================================= -->
  <!-- Left Sidebar (Claude Style)                               -->
  <!-- ========================================================= -->
  <aside id="sidebar" class="w-64 bg-[#141312] border-r border-[#2b2925] flex flex-col h-full shrink-0 transition-all duration-300 select-none z-30">
    
    <!-- Sidebar Header -->
    <div class="p-3.5 border-b border-[#262421] flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-7 h-7 rounded-lg bg-[#da7756] flex items-center justify-center shadow-md shadow-[#da7756]/20">
          <i data-lucide="sparkle" class="w-3.5 h-3.5 text-white fill-white"></i>
        </div>
        <span class="font-semibold tracking-tight text-[#fbfbfa] text-sm">Nexus AI</span>
      </div>
      <button onclick="toggleSidebar()" class="p-1.5 rounded-lg text-[#9e9890] hover:text-[#fbfbfa] hover:bg-[#22211e] transition" title="Close Sidebar">
        <i data-lucide="panel-left-close" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Start New Chat Button -->
    <div class="p-3">
      <button onclick="startNewChat()" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl bg-[#22211e] hover:bg-[#2a2925] text-[#edeae4] hover:text-white border border-[#33302c] hover:border-[#da7756]/50 transition shadow-sm group">
        <div class="flex items-center space-x-2.5">
          <i data-lucide="plus" class="w-4 h-4 text-[#da7756] group-hover:scale-110 transition-transform"></i>
          <span class="text-xs font-medium">Start new chat</span>
        </div>
        <kbd class="text-[10px] text-[#8e8880] font-mono px-1.5 py-0.5 rounded bg-[#1a1917] border border-[#2e2c28]">Ctrl+K</kbd>
      </button>
    </div>

    <!-- Recent Chats Header -->
    <div class="px-3 pt-2 pb-1 text-[11px] font-medium text-[#827c74] tracking-wider uppercase">
      Recent Chats
    </div>

    <!-- Sessions List -->
    <div class="flex-1 overflow-y-auto px-2 py-1 space-y-1" id="sessionsList">
      <div class="text-center py-10 text-[#736d65] text-xs">
        <i data-lucide="message-square-dashed" class="w-5 h-5 mx-auto mb-2 opacity-50"></i>
        <span>No conversations yet</span>
      </div>
    </div>

    <!-- Sidebar Footer (Left lower corner kept empty) -->
    <div class="p-3.5 border-t border-[#262421] flex items-center justify-between text-xs text-[#9e9890]">
      <div></div>
      <a href="/docs" target="_blank" class="p-1.5 rounded hover:bg-[#22211e] text-[#9e9890] hover:text-[#da7756] transition" title="API Docs">
        <i data-lucide="book-open" class="w-3.5 h-3.5"></i>
      </a>
    </div>
  </aside>

  <!-- ========================================================= -->
  <!-- Main Chat Workspace                                       -->
  <!-- ========================================================= -->
  <div class="flex-1 flex flex-col h-full overflow-hidden relative bg-[#1a1917]">

    <!-- Top Navigation Header -->
    <header class="h-14 border-b border-[#2b2925] bg-[#1a1917]/90 backdrop-blur-md px-5 flex items-center justify-between shrink-0">
      <div class="flex items-center space-x-3">
        <!-- Sidebar Toggle -->
        <button id="expandSidebarBtn" onclick="toggleSidebar()" class="hidden p-1.5 rounded-lg text-[#9e9890] hover:text-[#fbfbfa] hover:bg-[#242320] transition" title="Open Sidebar">
          <i data-lucide="panel-left-open" class="w-4 h-4"></i>
        </button>

        <!-- Current Chat Title -->
        <div class="flex items-center space-x-2 max-w-md truncate">
          <span id="currentChatTitle" class="font-medium text-sm text-[#fbfbfa] truncate">New Conversation</span>
          <button id="editTitleBtn" onclick="promptRenameCurrentChat()" class="p-1 text-[#827c74] hover:text-[#fbfbfa] rounded transition" title="Rename Title">
            <i data-lucide="pencil" class="w-3 h-3"></i>
          </button>
        </div>
      </div>

      <!-- Right Upper Corner (Empty) -->
      <div></div>
    </header>

    <!-- Messages Scroll Area -->
    <main id="messagesScrollArea" class="flex-1 overflow-y-auto px-4 py-8">
      <div class="max-w-3xl mx-auto w-full space-y-7" id="messagesArea">

        <!-- Claude-Style Clean Welcome Banner (NO Boxes) -->
        <div id="welcomeBanner" class="text-center py-24 px-4 space-y-4">
          <div class="inline-flex p-3.5 rounded-2xl bg-[#22211e] border border-[#33302c] shadow-lg shadow-black/20">
            <i data-lucide="sparkle" class="w-7 h-7 text-[#da7756] fill-[#da7756]"></i>
          </div>
          <h2 id="welcomeGreetingTitle" class="text-3xl sm:text-4xl font-serif-title font-medium tracking-tight text-[#fbfbfa]">
            Good evening
          </h2>
          <p id="welcomeGreetingSub" class="text-[#9e9890] text-sm sm:text-base max-w-md mx-auto leading-relaxed font-light">
            Time for some coffee and coding?
          </p>
        </div>

      </div>
    </main>

    <!-- ========================================================= -->
    <!-- Bottom Input Bar (Claude-Style with Paperclip)            -->
    <!-- ========================================================= -->
    <div class="p-4 shrink-0 max-w-3xl w-full mx-auto">
      <div 
        id="inputDock"
        ondragover="handleDragOver(event)" 
        ondragleave="handleDragLeave(event)" 
        ondrop="handleFileDrop(event)"
        class="bg-[#22211e] border border-[#363430] rounded-2xl shadow-2xl p-3 focus-within:border-[#da7756] transition-all relative"
      >
        <!-- Uploaded Document Attachment Preview Chip -->
        <div id="attachedFileChip" class="hidden mb-2 inline-flex items-center space-x-2 px-3 py-1.5 rounded-xl bg-[#282723] border border-[#383531] text-xs text-[#edeae4]">
          <i data-lucide="file-text" class="w-3.5 h-3.5 text-[#da7756]"></i>
          <span id="attachedFileName" class="truncate max-w-xs font-medium">document.pdf</span>
          <span id="attachedFileSize" class="text-[10px] text-[#8e8880]">24 KB</span>
          <button type="button" onclick="removeAttachedFile()" class="p-0.5 text-[#8e8880] hover:text-[#f87171] transition" title="Remove attachment">
            <i data-lucide="x" class="w-3 h-3"></i>
          </button>
        </div>

        <!-- Hidden File Input -->
        <input 
          type="file" 
          id="fileInput" 
          accept=".pdf,.docx,.doc,.txt,.csv,.md,.py,.json,.log" 
          class="hidden" 
          onchange="handleFileSelect(event)"
        />

        <!-- Textarea with Dynamic Words Placeholder -->
        <textarea
          id="promptInput"
          rows="1"
          placeholder="Ask anything, write code, or attach documents..."
          class="w-full bg-transparent resize-none border-0 text-[#fbfbfa] placeholder-[#7d776f] focus:outline-none focus:ring-0 text-sm py-1.5 px-2 max-h-44 min-h-[44px] leading-relaxed"
          onkeydown="handleKeyDown(event)"
          oninput="autoResize(this)"
        ></textarea>

        <!-- Bottom Action Row: Paperclip + Clean Send Button -->
        <div class="flex items-center justify-between pt-1 px-1 border-t border-[#2a2824] mt-1">
          <!-- Paperclip attachment button -->
          <div class="flex items-center space-x-2">
            <button
              type="button"
              onclick="document.getElementById('fileInput').click()"
              class="p-1.5 rounded-lg text-[#8e8880] hover:text-[#da7756] hover:bg-[#282723] transition"
              title="Attach Document (PDF, Word, Code, CSV, Text)"
            >
              <i data-lucide="paperclip" class="w-4 h-4"></i>
            </button>
            <span id="uploadStatusText" class="text-[11px] text-[#da7756] italic hidden">Parsing document...</span>
          </div>

          <!-- Send Button -->
          <button
            id="sendBtn"
            onclick="sendMessage()"
            class="w-8 h-8 rounded-xl bg-[#da7756] hover:bg-[#c56545] text-white flex items-center justify-center transition shrink-0 disabled:opacity-30 disabled:cursor-not-allowed shadow-md shadow-[#da7756]/20"
            title="Send Message"
          >
            <i data-lucide="arrow-up" class="w-4 h-4 text-white stroke-[2.5]"></i>
          </button>
        </div>
      </div>

      <!-- Clean empty space below -->
      <div class="h-2"></div>
    </div>

  </div>

  <!-- ========================================================= -->
  <!-- Client JavaScript Logic                                   -->
  <!-- ========================================================= -->
  <script>
    let currentSessionId = null;
    let messageHistory = [];
    let isGenerating = false;
    let sessionsCache = [];
    let uploadedAttachment = null;

    lucide.createIcons();

    // Hotkey: Ctrl+K or Cmd+K -> New Chat
    window.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "k") {
        e.preventDefault();
        startNewChat();
      }
    });

    // -------------------------------------------------------------
    // Dynamic Welcome Words
    // -------------------------------------------------------------
    function getDynamicWelcome() {
      const hour = new Date().getHours();
      const hasVisited = localStorage.getItem("nexus_user_visited");
      const hasPastSessions = sessionsCache && sessionsCache.length > 0;
      const isReturning = Boolean(hasVisited || hasPastSessions);

      let timeGreeting = "Good day";
      if (hour >= 5 && hour < 12) timeGreeting = "Good morning";
      else if (hour >= 12 && hour < 17) timeGreeting = "Good afternoon";
      else if (hour >= 17 && hour < 22) timeGreeting = "Good evening";
      else timeGreeting = "Late night focus";

      const returningPhrases = [
        "Time for some coffee and coding?",
        "What are we building today?",
        "Ready to solve something interesting?",
        "Coffee poured, ready to create.",
        "Where should we begin?",
        "Fresh ideas to explore."
      ];

      const newPhrases = [
        "A thoughtful partner for reasoning, research, and creation.",
        "Ask anything, write code, or explore ideas.",
        "Ready whenever you are."
      ];

      if (isReturning) {
        const phrase = returningPhrases[Math.floor(Math.random() * returningPhrases.length)];
        return { heading: timeGreeting, subtext: phrase };
      } else {
        localStorage.setItem("nexus_user_visited", "true");
        const phrase = newPhrases[Math.floor(Math.random() * newPhrases.length)];
        return { heading: "Welcome to Nexus AI", subtext: phrase };
      }
    }

    // -------------------------------------------------------------
    // Dynamic Input Placeholders
    // -------------------------------------------------------------
    const DYNAMIC_PLACEHOLDERS = [
      "Ask anything, write code, or explore ideas...",
      "What would you like to explore today?",
      "Coffee and coding mode...",
      "Search the web or describe an image...",
      "Generate a Word document or PDF report...",
      "Write code, brainstorm, or ask questions...",
      "How can I help you right now?"
    ];
    let placeholderIndex = 0;

    function rotatePlaceholder() {
      const input = document.getElementById("promptInput");
      if (input && !input.value.trim() && document.activeElement !== input) {
        placeholderIndex = (placeholderIndex + 1) % DYNAMIC_PLACEHOLDERS.length;
        input.placeholder = DYNAMIC_PLACEHOLDERS[placeholderIndex];
      }
    }
    setInterval(rotatePlaceholder, 4500);

    // -------------------------------------------------------------
    // Initial Boot: Always Observe Fresh Start
    // -------------------------------------------------------------
    async function boot() {
      await loadSessions();
      startNewChat();
    }
    boot();

    // -------------------------------------------------------------
    // Sidebar & Session Management
    // -------------------------------------------------------------
    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      const expandBtn = document.getElementById("expandSidebarBtn");
      if (sidebar.classList.contains("-ml-64") || sidebar.classList.contains("hidden")) {
        sidebar.classList.remove("-ml-64", "hidden");
        expandBtn.classList.add("hidden");
      } else {
        sidebar.classList.add("-ml-64");
        expandBtn.classList.remove("hidden");
      }
    }

    async function loadSessions() {
      try {
        const res = await fetch("/api/sessions");
        sessionsCache = await res.json();
        renderSessionsList();
      } catch (err) {
        console.error("Load sessions error:", err);
      }
    }

    function renderSessionsList() {
      const listEl = document.getElementById("sessionsList");
      if (!sessionsCache || sessionsCache.length === 0) {
        listEl.innerHTML = `
          <div class="text-center py-10 text-[#736d65] text-xs">
            <i data-lucide="message-square-dashed" class="w-5 h-5 mx-auto mb-2 opacity-50"></i>
            <span>No conversations yet</span>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      listEl.innerHTML = sessionsCache.map(s => {
        const isActive = s.id === currentSessionId;
        const activeClasses = isActive 
          ? "bg-[#282723] text-[#ffffff] font-medium border-[#da7756]/50 shadow-sm" 
          : "text-[#c7c2b9] hover:text-white hover:bg-[#201f1c] border-transparent";

        return `
          <div 
            onclick="loadSession('${s.id}')"
            class="group flex items-center justify-between px-3 py-2.5 rounded-xl text-xs cursor-pointer border transition ${activeClasses}"
          >
            <div class="flex items-center space-x-2.5 truncate flex-1 mr-1">
              <i data-lucide="message-square" class="w-3.5 h-3.5 shrink-0 ${isActive ? 'text-[#da7756]' : 'text-[#827c74]'} group-hover:text-[#da7756] transition"></i>
              <span class="truncate">${escapeHtml(s.title || "Untitled Conversation")}</span>
            </div>
            <div class="flex items-center space-x-1 opacity-0 group-hover:opacity-100 transition shrink-0" onclick="event.stopPropagation()">
              <button onclick="promptRenameSession('${s.id}')" class="p-1 text-[#8e8880] hover:text-white rounded transition" title="Rename">
                <i data-lucide="pencil" class="w-3 h-3"></i>
              </button>
              <button onclick="deleteSession('${s.id}')" class="p-1 text-[#8e8880] hover:text-[#f87171] rounded transition" title="Delete">
                <i data-lucide="trash-2" class="w-3 h-3"></i>
              </button>
            </div>
          </div>
        `;
      }).join("");

      lucide.createIcons();
    }

    function startNewChat() {
      currentSessionId = null;
      messageHistory = [];
      removeAttachedFile();
      document.getElementById("currentChatTitle").innerText = "New Conversation";
      
      const { heading, subtext } = getDynamicWelcome();
      const messagesArea = document.getElementById("messagesArea");
      messagesArea.innerHTML = `
        <div id="welcomeBanner" class="text-center py-24 px-4 space-y-4">
          <div class="inline-flex p-3.5 rounded-2xl bg-[#22211e] border border-[#33302c] shadow-lg shadow-black/20">
            <i data-lucide="sparkle" class="w-7 h-7 text-[#da7756] fill-[#da7756]"></i>
          </div>
          <h2 id="welcomeGreetingTitle" class="text-3xl sm:text-4xl font-serif-title font-medium tracking-tight text-[#fbfbfa]">
            ${heading}
          </h2>
          <p id="welcomeGreetingSub" class="text-[#9e9890] text-sm sm:text-base max-w-md mx-auto leading-relaxed font-light">
            ${subtext}
          </p>
        </div>
      `;
      lucide.createIcons();
      renderSessionsList();
      const input = document.getElementById("promptInput");
      if (input) input.focus();
    }

    async function loadSession(sessionId) {
      if (isGenerating) return;
      currentSessionId = sessionId;
      removeAttachedFile();
      renderSessionsList();

      try {
        const res = await fetch(`/api/sessions/${sessionId}`);
        if (!res.ok) throw new Error("Session not found");
        const data = await res.json();

        document.getElementById("currentChatTitle").innerText = data.session.title || "Conversation";

        const messagesArea = document.getElementById("messagesArea");
        messagesArea.innerHTML = "";
        messageHistory = [];

        if (!data.messages || data.messages.length === 0) {
          startNewChat();
          return;
        }

        data.messages.forEach((msg, idx) => {
          messageHistory.push({ role: msg.role, content: msg.content });
          if (msg.role === "user") {
            appendUserMessage(msg.content);
          } else {
            renderCompletedAssistantCard(msg, idx);
          }
        });

        scrollToBottom();
      } catch (err) {
        console.error("Load session error:", err);
      }
    }

    async function promptRenameSession(sessionId) {
      const s = sessionsCache.find(item => item.id === sessionId);
      const currentTitle = s ? s.title : "Conversation";
      const newTitle = prompt("Enter new title for this conversation:", currentTitle);
      if (!newTitle || newTitle.trim() === "" || newTitle === currentTitle) return;

      try {
        const res = await fetch(`/api/sessions/${sessionId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title: newTitle.trim() })
        });
        if (res.ok) {
          if (currentSessionId === sessionId) {
            document.getElementById("currentChatTitle").innerText = newTitle.trim();
          }
          await loadSessions();
        }
      } catch (err) {
        alert("Failed to rename conversation.");
      }
    }

    function promptRenameCurrentChat() {
      if (!currentSessionId) return;
      promptRenameSession(currentSessionId);
    }

    async function deleteSession(sessionId) {
      if (!confirm("Are you sure you want to delete this conversation?")) return;

      try {
        const res = await fetch(`/api/sessions/${sessionId}`, { method: "DELETE" });
        if (res.ok) {
          await loadSessions();
          if (currentSessionId === sessionId) {
            startNewChat();
          }
        }
      } catch (err) {
        alert("Failed to delete conversation.");
      }
    }

    // -------------------------------------------------------------
    // Document Upload & Attachment Handling (Paperclip)
    // -------------------------------------------------------------
    async function uploadFile(file) {
      if (!file) return;
      const statusText = document.getElementById("uploadStatusText");
      if (statusText) {
        statusText.innerText = "Parsing document...";
        statusText.classList.remove("hidden");
      }

      const formData = new FormData();
      formData.append("file", file);

      try {
        const res = await fetch("/api/upload", {
          method: "POST",
          body: formData
        });
        if (!res.ok) throw new Error(`Upload failed: ${res.statusText}`);
        const data = await res.json();
        uploadedAttachment = data;

        // Show attachment chip
        const chip = document.getElementById("attachedFileChip");
        const nameEl = document.getElementById("attachedFileName");
        const sizeEl = document.getElementById("attachedFileSize");
        if (chip && nameEl && sizeEl) {
          nameEl.innerText = data.filename;
          sizeEl.innerText = `${Math.round(data.size_bytes / 1024)} KB`;
          chip.classList.remove("hidden");
        }

        // Set focus and dynamic prompt invitation (like Claude)
        const promptInput = document.getElementById("promptInput");
        if (promptInput) {
          if (!promptInput.value.trim()) {
            promptInput.placeholder = `Deep-dive into ${data.filename} (Press Enter to analyze)...`;
          }
          promptInput.focus();
        }
      } catch (err) {
        alert(`Document upload error: ${err.message}`);
      } finally {
        if (statusText) statusText.classList.add("hidden");
        lucide.createIcons();
      }
    }

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (file) uploadFile(file);
    }

    function removeAttachedFile() {
      uploadedAttachment = null;
      const chip = document.getElementById("attachedFileChip");
      if (chip) chip.classList.add("hidden");
      const fileInput = document.getElementById("fileInput");
      if (fileInput) fileInput.value = "";
      const promptInput = document.getElementById("promptInput");
      if (promptInput && !promptInput.value.trim()) {
        promptInput.placeholder = DYNAMIC_PLACEHOLDERS[0];
      }
    }

    // -------------------------------------------------------------
    // Global PC Drag & Drop File Upload
    // -------------------------------------------------------------
    window.addEventListener("dragenter", (e) => {
      e.preventDefault();
      const overlay = document.getElementById("dropOverlay");
      if (overlay) overlay.classList.remove("hidden");
    });

    window.addEventListener("dragover", (e) => {
      e.preventDefault();
    });

    window.addEventListener("dragleave", (e) => {
      if (e.clientX <= 0 || e.clientY <= 0) {
        const overlay = document.getElementById("dropOverlay");
        if (overlay) overlay.classList.add("hidden");
      }
    });

    window.addEventListener("drop", (e) => {
      e.preventDefault();
      const overlay = document.getElementById("dropOverlay");
      if (overlay) overlay.classList.add("hidden");
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        uploadFile(e.dataTransfer.files[0]);
      }
    });

    function handleDragOver(e) {
      e.preventDefault();
      document.getElementById("inputDock").classList.add("border-[#da7756]");
    }

    function handleDragLeave(e) {
      e.preventDefault();
      document.getElementById("inputDock").classList.remove("border-[#da7756]");
    }

    function handleFileDrop(e) {
      e.preventDefault();
      document.getElementById("inputDock").classList.remove("border-[#da7756]");
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        uploadFile(e.dataTransfer.files[0]);
      }
    }

    // -------------------------------------------------------------
    // On-Demand Message Export (PDF / Word)
    // -------------------------------------------------------------
    async function exportMessageToDoc(messageContent, format) {
      try {
        const res = await fetch("/api/export", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title: "Nexus AI Document",
            content: messageContent,
            format: format
          })
        });
        if (!res.ok) throw new Error("Export failed");
        const data = await res.json();

        // Trigger browser download
        const a = document.createElement("a");
        a.href = data.download_url;
        a.download = data.filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch (err) {
        alert(`Export failed: ${err.message}`);
      }
    }

    // -------------------------------------------------------------
    // Dynamic Words Progress
    // -------------------------------------------------------------
    const REASONING_PHRASES = [
      "Thinking...",
      "Synthesizing thoughts...",
      "Considering context...",
      "Formulating response..."
    ];

    const SEARCH_PHRASES = [
      "Browsing the web...",
      "Analyzing sources...",
      "Verifying information...",
      "Synthesizing findings..."
    ];

    const IMAGE_PHRASES = [
      "Imagining concept...",
      "Rendering illustration...",
      "Synthesizing visual..."
    ];

    const DOC_PHRASES = [
      "Drafting document structure...",
      "Authoring content...",
      "Compiling and styling document..."
    ];

    function autoResize(el) {
      el.style.height = "auto";
      el.style.height = Math.min(el.scrollHeight, 180) + "px";
    }

    function handleKeyDown(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    async function sendMessage() {
      const input = document.getElementById("promptInput");
      let text = input.value.trim();
      const currentAttachment = uploadedAttachment;

      // Allow sending if there is text OR an attached document (like Claude)
      if ((!text && !currentAttachment) || isGenerating) return;

      // If user sends an attached file without a typed message:
      if (!text && currentAttachment) {
        text = `Analyze and provide a comprehensive deep dive of ${currentAttachment.filename}.`;
      }

      // Remove welcome banner
      const banner = document.getElementById("welcomeBanner");
      if (banner) banner.remove();

      // Display attached document pill in user message if any
      appendUserMessage(text, currentAttachment);
      messageHistory.push({ role: "user", content: text });

      input.value = "";
      input.style.height = "auto";
      isGenerating = true;
      document.getElementById("sendBtn").disabled = true;

      // Create live assistant card with dynamic thinking phrases (no boxes)
      const assistantCard = createAssistantMessageCard();
      const statusIndicator = assistantCard.querySelector(".dynamic-status");
      const statusText = assistantCard.querySelector(".dynamic-status-text");
      const sourcesContainer = assistantCard.querySelector(".sources-container");
      const contentContainer = assistantCard.querySelector(".content-container");

      // Rotate natural phrases
      let phraseIndex = 0;
      let activePhraseList = REASONING_PHRASES;
      const phraseInterval = setInterval(() => {
        phraseIndex = (phraseIndex + 1) % activePhraseList.length;
        if (statusText && !statusIndicator.classList.contains("hidden")) {
          statusText.innerText = activePhraseList[phraseIndex];
        }
      }, 2200);

      try {
        const payload = {
          messages: messageHistory,
          session_id: currentSessionId,
          mode: "auto",
          attachments: currentAttachment ? [currentAttachment] : null
        };

        // Clear attachment chip after sending
        removeAttachedFile();

        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error(`Server status ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";
        let accumulatedTokens = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const events = buffer.split("\n\n");
          buffer = events.pop();

          for (const ev of events) {
            if (!ev.trim()) continue;
            const lines = ev.split("\n");
            let eventType = "message";
            let eventData = "";

            for (const line of lines) {
              if (line.startsWith("event: ")) {
                eventType = line.replace("event: ", "").trim();
              } else if (line.startsWith("data: ")) {
                eventData = line.replace("data: ", "").trim();
              }
            }

            if (!eventData) continue;
            const parsed = JSON.parse(eventData);

            if (eventType === "session") {
              currentSessionId = parsed.id;
              if (parsed.title) {
                document.getElementById("currentChatTitle").innerText = parsed.title;
              }
            } else if (eventType === "intent") {
              if (parsed.intent === "search") {
                activePhraseList = SEARCH_PHRASES;
                statusText.innerText = "Browsing the web...";
              } else if (parsed.intent === "image") {
                activePhraseList = IMAGE_PHRASES;
                statusText.innerText = "Rendering visual...";
              } else {
                activePhraseList = REASONING_PHRASES;
                statusText.innerText = "Thinking...";
              }
            } else if (eventType === "status") {
              if (parsed.message) {
                statusText.innerText = parsed.message;
              }
            } else if (eventType === "document") {
              // Document generated
              statusText.innerText = `Compiled ${parsed.format.toUpperCase()} document!`;
            } else if (eventType === "sources") {
              if (parsed.sources && parsed.sources.length > 0) {
                sourcesContainer.classList.remove("hidden");
                sourcesContainer.innerHTML = `
                  <div class="text-[11px] font-medium text-[#9e9890] uppercase tracking-wider mb-2 flex items-center space-x-1.5">
                    <i data-lucide="layers" class="w-3 h-3 text-[#da7756]"></i>
                    <span>Sources consulted (${parsed.sources.length})</span>
                  </div>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-2">
                    ${parsed.sources.map((s, idx) => `
                      <a href="${s.url}" target="_blank" rel="noopener noreferrer" class="p-2.5 rounded-lg bg-[#1a1917] border border-[#2e2c28] hover:border-[#da7756]/60 hover:bg-[#201f1c] transition block text-xs">
                        <div class="flex items-center space-x-1.5 text-[#edeae4] font-medium truncate">
                          <span class="text-[10px] px-1.5 py-0.2 rounded bg-[#282723] text-[#da7756] border border-[#da7756]/30 font-mono">[${idx+1}]</span>
                          <span class="truncate">${escapeHtml(s.title || "Web Source")}</span>
                        </div>
                        <p class="text-[#8e8880] text-[10px] truncate mt-1">${escapeHtml(s.url)}</p>
                      </a>
                    `).join("")}
                  </div>
                `;
                lucide.createIcons();
              }
            } else if (eventType === "token") {
              clearInterval(phraseInterval);
              statusIndicator.classList.add("hidden");
              accumulatedTokens += parsed.token;
              contentContainer.innerHTML = marked.parse(accumulatedTokens);
              scrollToBottom();
            } else if (eventType === "done") {
              clearInterval(phraseInterval);
              statusIndicator.classList.add("hidden");
              messageHistory.push({ role: "assistant", content: accumulatedTokens });
              if (parsed.title) {
                document.getElementById("currentChatTitle").innerText = parsed.title;
              }
              loadSessions();
            }
          }
        }
      } catch (err) {
        clearInterval(phraseInterval);
        statusText.innerText = `Error: ${err.message}`;
      } finally {
        clearInterval(phraseInterval);
        statusIndicator.classList.add("hidden");
        isGenerating = false;
        document.getElementById("sendBtn").disabled = false;
        scrollToBottom();
      }
    }

    function appendUserMessage(text, attachment = null) {
      const messagesArea = document.getElementById("messagesArea");
      const wrapper = document.createElement("div");
      wrapper.className = "flex justify-end";

      let attachmentHtml = "";
      if (attachment) {
        attachmentHtml = `
          <div class="mb-2 inline-flex items-center space-x-2 px-2.5 py-1 rounded-lg bg-[#1f1e1b] border border-[#383531] text-xs text-[#da7756]">
            <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
            <span class="font-medium">${escapeHtml(attachment.filename)}</span>
            <span class="text-[10px] text-[#8e8880]">(${Math.round(attachment.size_bytes/1024)} KB)</span>
          </div>
        `;
      }

      wrapper.innerHTML = `
        <div class="max-w-xl bg-[#282723] text-[#fbfbfa] px-4 py-3 rounded-2xl rounded-tr-sm text-sm border border-[#363430] shadow-sm leading-relaxed">
          ${attachmentHtml}
          <div>${escapeHtml(text)}</div>
        </div>
      `;
      messagesArea.appendChild(wrapper);
      lucide.createIcons();
      scrollToBottom();
    }

    function createAssistantMessageCard() {
      const messagesArea = document.getElementById("messagesArea");
      const wrapper = document.createElement("div");
      wrapper.className = "flex space-x-3.5 items-start assistant-card";
      wrapper.innerHTML = `
        <div class="w-7 h-7 rounded-lg bg-[#da7756] flex items-center justify-center shrink-0 mt-1 shadow-md shadow-[#da7756]/20">
          <i data-lucide="sparkle" class="w-3.5 h-3.5 text-white fill-white"></i>
        </div>
        <div class="flex-1 space-y-3 max-w-2xl bg-[#22211e]/70 p-4 rounded-2xl border border-[#2e2c28]">
          <!-- Dynamic words indicator (no boxes) -->
          <div class="dynamic-status flex items-center space-x-2 text-xs text-[#9e9890] thinking-shimmer">
            <span class="w-1.5 h-1.5 rounded-full bg-[#da7756] animate-pulse"></span>
            <span class="dynamic-status-text font-normal italic">Thinking...</span>
          </div>
          <div class="sources-container hidden"></div>
          <div class="content-container prose prose-invert prose-sm text-[#edeae4]"></div>
        </div>
      `;
      messagesArea.appendChild(wrapper);
      lucide.createIcons();
      scrollToBottom();
      return wrapper;
    }

    function renderCompletedAssistantCard(msg, idx) {
      const messagesArea = document.getElementById("messagesArea");
      const wrapper = document.createElement("div");
      wrapper.className = "flex space-x-3.5 items-start assistant-card";

      let sourcesHtml = "";
      if (msg.sources && msg.sources.length > 0) {
        sourcesHtml = `
          <div class="text-[11px] font-medium text-[#9e9890] uppercase tracking-wider mb-2 flex items-center space-x-1.5">
            <i data-lucide="layers" class="w-3 h-3 text-[#da7756]"></i>
            <span>Sources consulted (${msg.sources.length})</span>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-3">
            ${msg.sources.map((s, sIdx) => `
              <a href="${s.url}" target="_blank" rel="noopener noreferrer" class="p-2.5 rounded-lg bg-[#1a1917] border border-[#2e2c28] hover:border-[#da7756]/60 hover:bg-[#201f1c] transition block text-xs">
                <div class="flex items-center space-x-1.5 text-[#edeae4] font-medium truncate">
                  <span class="text-[10px] px-1.5 py-0.2 rounded bg-[#282723] text-[#da7756] border border-[#da7756]/30 font-mono">[${sIdx+1}]</span>
                  <span class="truncate">${escapeHtml(s.title || "Web Source")}</span>
                </div>
                <p class="text-[#8e8880] text-[10px] truncate mt-1">${escapeHtml(s.url)}</p>
              </a>
            `).join("")}
          </div>
        `;
      }

      wrapper.innerHTML = `
        <div class="w-7 h-7 rounded-lg bg-[#da7756] flex items-center justify-center shrink-0 mt-1 shadow-md shadow-[#da7756]/20">
          <i data-lucide="sparkle" class="w-3.5 h-3.5 text-white fill-white"></i>
        </div>
        <div class="flex-1 space-y-3 max-w-2xl bg-[#22211e]/70 p-4 rounded-2xl border border-[#2e2c28]">
          ${sourcesHtml}
          <div class="content-container prose prose-invert prose-sm text-[#edeae4]">
            ${marked.parse(msg.content)}
          </div>
        </div>
      `;
      messagesArea.appendChild(wrapper);
      lucide.createIcons();
    }

    function scrollToBottom() {
      const area = document.getElementById("messagesScrollArea");
      if (area) area.scrollTop = area.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text || "";
      return div.innerHTML;
    }
  </script>
</body>
